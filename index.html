<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>사이언스 퀘스트 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen 3D lab scene; glass panel docks right on wide screens, bottom on tall ones */
:root{
  --bg:#060a17; --panel:rgba(11,17,36,.8); --line:rgba(160,180,255,.15);
  --fg:#eef1ff; --muted:#9aa3c7; --c:#ffb547; --ok:#4fe0b0; --bad:#ff5d6c;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(255,60,80,.45));opacity:0;transition:opacity .5s}
#flash.on{opacity:1;transition:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
#hud{pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.hud-row{display:flex;align-items:center;gap:18px}
.hud-row .stat:first-of-type{margin-left:auto}
.stat{display:flex;flex-direction:column;align-items:flex-end;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.lab{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.stat b{font-family:var(--display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
#combo.hot{color:var(--c)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transform-origin:left;box-shadow:0 0 12px var(--c)}
.stage{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;width:100%;max-width:560px;max-height:62%;overflow:auto;background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;
  padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
@media (min-aspect-ratio:6/5){.stage{justify-content:flex-end;align-items:center}.panel{width:min(50%,540px);max-height:100%}}
.panel.in{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px);opacity:.3}}
.eyebrow{margin:0;font-size:12px;letter-spacing:.2em;color:var(--c);font-weight:800}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,7vw,60px);line-height:.98;margin:0}
h1 span{color:var(--c);transition:color .4s}
.sub{margin:0;color:var(--muted);line-height:1.6;font-size:14px;max-width:46ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);
  color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--body);transition:transform .2s,border-color .2s,background .2s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--tc);background:rgba(255,255,255,.07)}
.tile .no{position:absolute;top:5px;left:7px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .sy{font-family:var(--display);font-size:clamp(16px,3.4vw,24px);color:var(--tc);line-height:1}
.tile .nm{font-size:10px;color:var(--muted);text-align:center;line-height:1.2;padding:0 2px}
.best{margin:0;font-size:13px;color:var(--muted)}
.best b{color:var(--fg);font-variant-numeric:tabular-nums}
.qhead{display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.06em;padding:5px 12px 5px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.timer{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
h2{margin:0;font-size:clamp(18px,1.4vw + 12px,24px);line-height:1.45;font-weight:800;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;min-height:56px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--fg);font:600 15px/1.35 var(--body);cursor:pointer;transition:background .2s,border-color .2s,opacity .3s,transform .15s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:var(--c)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.08);color:var(--muted)}
.opt span:last-child{min-width:0}
.opt.ok{border-color:var(--ok);background:rgba(79,224,176,.18)} .opt.ok .k{background:var(--ok);color:#04261b}
.opt.bad{border-color:var(--bad);background:rgba(255,93,108,.18);animation:wob .35s} .opt.bad .k{background:var(--bad);color:#2a0308}
.opt.dim{opacity:.35}
@keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--c)}
.exp p{margin:0;flex:1 1 220px;min-width:0;font-size:14px;line-height:1.6;color:#d6dbf5}
.exp b{color:var(--fg)}
button{font-family:var(--body)}
.primary,.ghost{border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid transparent}
.primary{background:var(--c);color:#14100a;transition:filter .2s}
.primary:hover{filter:brightness(1.1)}
.ghost{background:rgba(255,255,255,.06);color:var(--fg);border-color:var(--line)}
#quit{padding:7px 12px;font-size:12px}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.rank{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);color:var(--c)}
.big{font-family:var(--display);font-size:clamp(48px,9vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.35em;color:var(--muted);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:10px;background:rgba(255,255,255,.04)}
.stats b{font-size:20px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
#pop{white-space:pre-line;position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,6vw,48px);pointer-events:none;opacity:0;text-shadow:0 4px 24px rgba(0,0,0,.6);text-align:center;width:90vw;line-height:1.15}
#pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.boss{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.boss b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.hpbar{height:10px;border:1px solid rgba(255,93,108,.35)}
.hpbar i{background:linear-gradient(90deg,#ff3050,#ff8a4c,#ffd166);box-shadow:0 0 14px #ff5d6c;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.hpbar.prog{border-color:var(--line)}
.hpbar.prog i{background:var(--c);box-shadow:0 0 12px var(--c)}
#warn{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;pointer-events:none;text-align:center;background:repeating-linear-gradient(-45deg,transparent 0 30px,rgba(255,40,60,.1) 30px 60px)}
#warn b{font-family:var(--display);font-weight:400;font-size:clamp(48px,11vw,100px);color:#ff3050;letter-spacing:.08em;text-shadow:0 0 34px #ff3050;animation:blink .3s steps(2) infinite}
#warn span{font-weight:800;letter-spacing:.3em;font-size:14px}
#warn em{font-style:normal;font-family:var(--display);font-size:clamp(24px,4.5vw,36px);text-shadow:0 4px 20px rgba(0,0,0,.7)}
@keyframes blink{50%{opacity:.3}}
.qhead{flex-wrap:wrap;gap:8px}
.prof{display:flex;flex-direction:column;gap:6px}
.lvrow{display:flex;justify-content:space-between;font-size:13px}
.lvrow span{color:var(--muted);font-variant-numeric:tabular-nums}
.ghost em{font-style:normal;color:var(--c);margin-left:4px;font-variant-numeric:tabular-nums}
.ghost:disabled{opacity:.4;cursor:default}
.lvup{margin:0;font-weight:800;color:var(--c)}
.lvup:empty{display:none}
.dex{display:flex;flex-direction:column;gap:16px}
.dex>div{display:flex;flex-direction:column;gap:8px}
.dex h3{margin:0;font-size:13px;letter-spacing:.04em;display:flex;justify-content:space-between;color:var(--tc)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{padding:10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;line-height:1.5;color:#c9cfe8;min-width:0}
.card b{display:block;color:var(--tc);font-size:13px;margin:3px 0}
.card.boss{border-color:#ffd166;background:rgba(255,209,102,.07)}
.card.lock{display:grid;place-items:center;min-height:64px;font-family:var(--display);font-size:20px;color:var(--muted);opacity:.55}
.items{display:flex;gap:6px;margin-left:auto}
.item{padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font:800 12px var(--body);cursor:pointer}
.item em{font-style:normal;color:var(--c);margin-left:2px}
.item:disabled{opacity:.3;cursor:default}
.lives{color:var(--bad);letter-spacing:2px}
.lives.hit{animation:wob .4s}
.opt.gone{visibility:hidden}
#comboLab{transition:color .3s}
body.fever #comboLab{color:var(--c);font-weight:800}
body.fever .panel{border-color:var(--c);animation:fv .9s ease-in-out infinite alternate}
@keyframes fv{from{box-shadow:0 0 0 1px var(--c),0 0 30px -10px var(--c),0 24px 70px rgba(0,0,0,.5)}to{box-shadow:0 0 0 1px var(--c),0 0 60px 0 var(--c),0 24px 70px rgba(0,0,0,.5)}}
.wrong{display:flex;flex-direction:column;gap:6px}
.wrong:empty{display:none}
.wrong h3{margin:0;font-size:13px;color:var(--muted);letter-spacing:.08em}
.wrong div{padding:10px 12px;border-radius:10px;background:rgba(255,93,108,.08);border-left:3px solid var(--bad);font-size:13px;line-height:1.55;color:#d6dbf5}
.wrong b{color:var(--ok)}
@media (max-height:460px){.panel{padding:12px;gap:10px}.opt{min-height:44px;padding:8px 10px;font-size:14px}h1{font-size:34px}.sub{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="flash"></div>
<div id="pop"></div>
<div id="warn" hidden><b>WARNING</b><span>BOSS 등장</span><em id="warnName"></em></div>
<div id="ui">
  <header id="hud" hidden>
    <div class="hud-row">
      <button id="quit" class="ghost">그만하기</button>
      <div class="stat"><span class="lab">목숨</span><b id="lives" class="lives">♥♥♥</b></div>
      <div class="stat"><span class="lab">문제</span><b id="qn">1/10</b></div>
      <div class="stat"><span class="lab" id="comboLab">콤보</span><b id="combo">0</b></div>
      <div class="stat"><span class="lab">점수</span><b id="score">0</b></div>
    </div>
    <div class="boss"><span id="bossName">BOSS</span><b id="bossHp">1500 / 1500</b></div>
    <div class="bar hpbar prog" id="hpbar"><i id="hp"></i></div>
    <div class="bar"><i id="tbar"></i></div>
  </header>
  <div class="stage">
    <section class="panel" id="menu">
      <p class="eyebrow">중3 비상 과학 · 시험 범위</p>
      <h1>사이언스<br><span>퀘스트</span></h1>
      <p class="sub">문제를 맞히면 레이저로 몬스터 처치! 5마리를 잡으면 보스가 등장하고, 어려운 보스 문제 3개를 맞혀야 쓰러뜨릴 수 있어요. 틀리면 반격당해 목숨이 깎여요.</p>
      <div class="tiles">
        <button class="tile" data-mode="bio" style="--tc:#ffb547"><span class="no">Ⅳ-2</span><span class="sy">신경</span><span class="nm">신경계와 호르몬</span></button>
        <button class="tile" data-mode="gen" style="--tc:#4fe0b0"><span class="no">Ⅴ-2</span><span class="sy">유전</span><span class="nm">멘델과 사람의 유전</span></button>
        <button class="tile" data-mode="star" style="--tc:#6fa8ff"><span class="no">Ⅶ</span><span class="sy">별</span><span class="nm">별과 우주</span></button>
        <button class="tile" data-mode="mix" style="--tc:#eef1ff"><span class="no">ALL</span><span class="sy">전체</span><span class="nm">시험 범위 섞기</span></button>
      </div>
      <div class="prof"><div class="lvrow"><b id="lvT">Lv.1 과학 새싹</b><span id="lvX">0 / 500 XP</span></div><div class="bar"><i id="lvBar"></i></div></div>
      <div class="row"><button class="ghost" id="dexBtn">지식 도감 <em id="dexN">0/64</em></button><button class="ghost" id="revBtn">오답 복습 <em id="revN">0</em></button></div>
      <p class="best">최고 점수 <b id="best">0</b> · 몬스터 5마리 → 보스전 · 목숨 3개</p>
    </section>

    <section class="panel" id="game" hidden>
      <div class="qhead"><span class="chip" id="cat">물리</span><span class="items"><button class="item" id="i50">50:50 <em id="n50">1</em></button><button class="item" id="itime">+5초 <em id="ntime">1</em></button></span><span class="timer" id="tnum">15.0</span></div>
      <h2 id="q"></h2>
      <div class="opts" id="opts"></div>
      <div class="exp" id="exp" hidden><p id="expT"></p><button id="next" class="primary">다음 문제</button></div>
    </section>

    <section class="panel" id="result" hidden>
      <p class="eyebrow">실험 결과</p>
      <div class="rank" id="rank"></div>
      <p class="lvup" id="rXp"></p>
      <div class="big"><span id="final">0</span><small>점</small></div>
      <div class="stats">
        <div><span class="lab">정답</span><b id="rRight">0/10</b></div>
        <div><span class="lab">최대 콤보</span><b id="rMax">0</b></div>
        <div><span class="lab">최고 점수</span><b id="rBest">0</b></div>
      </div>
      <p class="sub" id="rMsg"></p>
      <div class="wrong" id="wrongBox"></div>
      <div class="row"><button class="primary" id="again">다시 도전</button><button class="ghost" id="home">다른 과목</button></div>
    </section>
    <section class="panel" id="dex" hidden>
      <div class="qhead"><h2>지식 도감</h2><button class="ghost" id="dexBack">닫기</button></div>
      <p class="sub" id="dexSub"></p>
      <div class="dex" id="dexList"></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Q={
bio:{name:'Ⅳ-2. 신경계와 호르몬',css:'#ffb547',color:0xffb547,obj:'atom',list:[
['신경계는 중추 신경계와 무엇으로 구분될까?',['말초 신경계','감각 신경계','내분비계','연합 신경계'],'신경계 = 중추 신경계(뇌, 척수) + 말초 신경계(감각 신경, 운동 신경).'],
['중추 신경계를 이루는 것은?',['뇌와 척수','감각 신경과 운동 신경','뇌와 척추','척수와 운동 신경'],'중추 신경계는 뇌와 척수로, 자극을 느끼고 판단해 신호를 보내.'],
['말초 신경계를 이루는 것은?',['감각 신경과 운동 신경','뇌와 척수','대뇌와 소뇌','연합 뉴런'],'말초 신경계는 온몸에 퍼져서 중추 신경계와 온몸을 연결해.'],
['감각 기관에서 받아들인 자극을 중추 신경계로 전달하는 신경은?',['감각 신경','운동 신경','연합 신경','척추'],'운동 신경은 반대로 중추 신경계의 신호를 근육 같은 반응 기관으로 전달해.'],
['등뼈 속에 들어 있는 신경은?',['척수','척추','연수','소뇌'],'헷갈리기 쉬운 개념! 척추는 등뼈, 척수는 등뼈 속 신경이야.'],
['감각과 운동 조절, 기억·추리·감정 같은 정신 활동을 담당하는 뇌는?',['대뇌','소뇌','간뇌','연수'],'대뇌는 자극을 느끼고 판단해 적절한 신호를 보내.'],
['눈의 움직임, 동공과 홍채의 변화를 조절하는 뇌는?',['중간뇌','간뇌','소뇌','대뇌'],'중간뇌 = 눈! 밝은 곳에서 동공이 작아지는 것도 중간뇌가 조절해.'],
['체온을 비롯한 몸속의 상태를 일정하게 유지하는 뇌는?',['간뇌','중간뇌','연수','소뇌'],'간뇌는 항상성 유지의 중심이야.'],
['근육 운동을 조절하여 몸의 균형을 유지하는 뇌는?',['소뇌','대뇌','연수','중간뇌'],'자전거를 타며 균형 잡는 것도 소뇌 덕분이야.'],

 else if(G&&!G.locked){G.time=Math.max(0,G.time-dt);$('tbar').style.transform=`scaleX(${Math.min(1,G.time/G.maxT)})`;const tn=$('tnum');tn.textContent=G.time.toFixed(1);tn.classList.toggle('low',G.time<5);if(G.time<5&&Math.ceil(G.time)!==G.tk){G.tk=Math.ceil(G.time);beep(880,.05,'square',.03)}if(G.time<=0)answer(-1)}
 spin=Math.max(0,spin-dt*1.6);shake=Math.max(0,shake-dt*2);
 for(const k in OBJ){const g=OBJ[k],u=g.userData;u.s+=(u.t-u.s)*Math.min(1,dt*5);g.visible=u.s>.01;
  if(g.visible){const e=u.s<.99?u.s*u.s*(3-2*u.s):1;g.scale.setScalar(Math.max(e,.001)*(1+spin*.06));g.rotation.y+=dt*(.35+spin*5+(fever?1.2:0)+(G&&state==='play'&&G.hp<G.maxHp*.3?1.5:0));g.rotation.x=Math.sin(now/2400)*.15;g.position.z=Math.sin(lunge*Math.PI)*4-knock*1.5;if(u.tick)u.tick(dt)}}
 if(bLife>0){bLife=Math.max(0,bLife-dt*.7);for(let i=0;i<BN*3;i++){bp[i]+=bv[i]*dt;bv[i]*=.965}bmat.opacity=bLife;bgeo.attributes.position.needsUpdate=true}
 updMon(dt);if(lLife>0){lLife=Math.max(0,lLife-dt*3.5);lm1.opacity=lLife;lm2.opacity=lLife*.6}lunge=Math.max(0,lunge-dt*2);knock=Math.max(0,knock-dt*3);flashS.material.opacity=Math.max(0,flashS.material.opacity-dt*2.5);
 stars.rotation.y+=dt*(fever?.07:.008);
 cx+=(px*.7-cx)*dt*2;cy+=(-py*.5-cy)*dt*2;
 cam.position.x=cx+(Math.random()-.5)*shake;cam.position.y=cy+(Math.random()-.5)*shake;cam.lookAt(0,0,0);
 R.render(scene,cam);requestAnimationFrame(loop)}
